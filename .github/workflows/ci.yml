name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Four independent jobs run in parallel; `build-test-lint` fans them back
# in. Branch protection requires the status check named `build-test-lint`,
# so that gate job name must stay stable.
#
#   lint ────────┐
#   unit ────────┼──> build-test-lint (gate)
#   integration ─┤
#   python ──────┘
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: go build ./...

      - name: Format check (gofmt)
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::Files need gofmt:"
            echo "$diff"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

      - name: Test isolation lint
        # Every *_test.go that reaches tmux.Spawn must isolate
        # FLEET_TMUX_SOCKET or it leaks sessions onto the operator's server.
        run: bash scripts/lint-test-isolation.sh

      - name: Test isolation lint — regression fixtures
        run: bash scripts/tests/test_lint_test_isolation.sh

      - name: Integration lane script — regression fixtures
        run: bash scripts/tests/test_integration_lane.sh

  unit:
    runs-on: ubuntu-latest
    # Must exceed `go test -timeout=5m` plus the always() cleanup steps: a
    # job-level timeout CANCELS the job and skips always(), so the
    # process-level timeout has to fire first.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-python@v5
        # Tests exec skills/fleet-guard/main.py via `python3`.
        with:
          python-version: "3.12"

      - name: Pre-test leak sentinel
        run: bash scripts/ci-fleet-test-leak.sh sentinel

      - name: Test
        # -timeout=5m aborts a single wedged test (and its tmux execs) at
        # the process level instead of burning the runner's default ceiling.
        run: go test -race -count=1 -timeout=5m ./...

      - name: Reap /tmp/fleet-test-* sockets
        if: always()
        run: bash scripts/ci-fleet-test-leak.sh reap

      - name: Assert no /tmp/fleet-test-* leak
        if: always()
        run: bash scripts/ci-fleet-test-leak.sh assert

  integration:
    runs-on: ubuntu-latest
    # Three lanes at -timeout=5m each plus the scenario harness and the
    # always() cleanup steps; see the note on `unit`.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-test leak sentinel
        run: bash scripts/ci-fleet-test-leak.sh sentinel

      - name: Scenario harness — scripts/scenario.sh contract
        # Drives scripts/scenario.sh against the built binary, real tmux on
        # an isolated socket and the real fleet-guard Stop hook. Runs after
        # the sentinel so a `down` that leaves debris fails the leak gate.
        run: bash scripts/tests/test_scenario_sh.sh

      # The `coord-run --standby` spawning tests are fenced behind
      # //go:build integration (they fork-bomb a loaded box under the default
      # lane). scripts/integration-lane.sh runs only the tests that exist in
      # the tagged build and not the default one, so the default suite
      # (already covered by `unit`) is not re-run here. A new package with
      # integration-only tests needs its own lane step.
      #
      # FLEET_STANDBY_TIMEOUT=3s caps each standby (vs the 10m production
      # default). No -race: these exec real tmux subprocesses, which the race
      # detector cannot see, and it would roughly double the wall time.
      - name: Integration lane — internal/spawn
        run: FLEET_STANDBY_TIMEOUT=3s bash scripts/integration-lane.sh ./internal/spawn

      - name: Integration lane — cmd/fleet
        run: FLEET_STANDBY_TIMEOUT=3s bash scripts/integration-lane.sh ./cmd/fleet

      - name: Integration lane — internal/tui
        run: FLEET_STANDBY_TIMEOUT=3s bash scripts/integration-lane.sh ./internal/tui

      - name: Reap /tmp/fleet-test-* sockets
        if: always()
        run: bash scripts/ci-fleet-test-leak.sh reap

      - name: Assert no /tmp/fleet-test-* leak
        if: always()
        run: bash scripts/ci-fleet-test-leak.sh assert

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        # markdown: required by scripts/render-design-doc.py and its tests.
        run: python3 -m pip install --upgrade pip pytest markdown

      - name: Python tests
        run: python3 -m pytest skills/ scripts/ -q

  build-test-lint:
    # Required status check. `if: always()` so a failed or cancelled
    # upstream job produces a red check here rather than a skipped one
    # (branch protection treats skipped as passing).
    needs: [lint, unit, integration, python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null \
            || { echo "::error::an upstream job did not succeed"; exit 1; }

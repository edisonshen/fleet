name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Single job (build + format + lint + go test + python test) keeps the
  # CI surface simple and shares one checkout. Branch protection requires
  # the status check named `build-test-lint`; keep this job name stable so
  # no admin update is needed when adding steps.
  build-test-lint:
    runs-on: ubuntu-latest
    # ci-perf-pr1 (P0): hard wall-clock backstop. `go test -timeout=5m` (below)
    # aborts a wedged test at the process level and kills any wedged tmux exec;
    # this job-level cap is the OUTER belt to that suspenders so a hang OUTSIDE
    # the test process (build/lint) still bounds the run instead of burning the
    # runner's 24-min default as PR #232 did.
    #
    # The cap MUST exceed the SUM of every process-level `-timeout` plus the
    # always() cleanup/leak steps, or the job cap would fire BEFORE a wedged
    # test's own `-timeout` gets to abort it — and a GitHub job timeout CANCELS
    # the job (it does NOT flow through the failure path), skipping the always()
    # cleanup/leak steps this cap exists to preserve (codex iter-1 [P2]).
    #
    # Process-level timeouts now in play (each step gets its OWN budget; the
    # PR-A integration lane is split per-package, see the steps below):
    #   - default `go test -race ./...`     : 5m
    #   - integration internal/spawn        : 5m
    #   - integration cmd/fleet             : 7m
    #   - integration internal/handoffop    : 5m
    # Worst-case sum if every step burns its full timeout = 22m, plus the
    # UNBUDGETED steps that sit between/after the timed lanes and the always()
    # cleanup: ~2m setup/build/lint, the two test-isolation lints + leak
    # sentinel (~1m), the Python `pytest skills/ scripts/` step (~1m), and ~2m
    # always() cleanup/leak headroom = ~28m (codex iter-9 [P2]: the Python step
    # was previously omitted from this sum, eating the cap margin). The cap MUST
    # sit above that so the per-step `-timeout` reliably fires first and the
    # cleanup steps survive — a GitHub job timeout CANCELS the job and skips
    # always(). EXPECTED (green) run is far smaller — default lane ~3m + each
    # integration package ~3-4m ≈ 15m wall — the caps are a backstop, not the
    # normal run. 35 = ~28m worst-case + ~7m margin; still far below the
    # GitHub-hosted runner's multi-hour default, so a true hang OUTSIDE a test
    # process (e.g. a wedged lint) is still bounded instead of running away as
    # PR #232 did.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        # markdown: required by scripts/render-design-doc.py and its tests
        # (scripts/tests/). Tests skip gracefully if it's missing, but CI
        # installs it so the hub-style render path is actually exercised.
        run: python3 -m pip install --upgrade pip pytest markdown

      - name: Build
        run: go build ./...

      - name: Format check (gofmt)
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::Files need gofmt:"
            echo "$diff"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

      - name: Test isolation lint
        # Postmortem 2026-05-14 (orphan tmux leak): every *_test.go that
        # calls tmux.Spawn / spawn.Spawn must isolate FLEET_TMUX_SOCKET
        # or it leaks tmux sessions onto the operator's default server.
        # This guard fails CI when a future PR forgets the isolation.
        run: bash scripts/lint-test-isolation.sh

      - name: Test isolation lint — regression fixtures
        # Codex review iter-2 [P2] (2026-06-04, fleet#165 PR-A): the
        # shell-fixture regression suite for scripts/lint-test-isolation.sh
        # was not exercised by CI before this step. Python pytest skips
        # *.sh files, so the lint scanner could silently regress as long
        # as the current repo happens to lint clean. This step pins both
        # the test-isolation marker contract AND the empty-command
        # dispatchOpts guard against future awk/regex drift.
        run: bash scripts/tests/test_lint_test_isolation.sh

      - name: Pre-test leak sentinel
        # fleet#165 PR-B (per feedback_fleet_owns_its_resources.md): a
        # green CI run with /tmp/fleet-test-* debris left over is NOT a
        # green run. We touch a sentinel here so the post-test assertion
        # can scope its leak check to files created during THIS run only,
        # ignoring any pre-existing /tmp/fleet-test-* on dev machines
        # (CI runners are clean, but the same workflow file is also
        # exercised by act / local-runner emulators).
        run: touch /tmp/fleet-test-ci-sentinel

      - name: Test
        # -timeout=5m (ci-perf-pr1, P0): a single wedged test (e.g. the /tmp
        # socket-scan grinding N tmux subprocesses) aborts at 5m at the process
        # level — Go's timeout kills the wedged tmux execs — instead of running
        # until the runner's own 24-min ceiling (the PR #232 hang).
        run: go test -race -count=1 -timeout=5m ./...

      # Integration test lane (lease-failover standby) — PR-A fork-bomb fix
      # (DESIGN-spawn-test-fork-bomb-root-fix): the genuine `coord-run --standby`
      # spawning tests are fenced out of the default `go test ./...` lane (they
      # fork-bomb a loaded box). They live behind //go:build integration and run
      # HERE so they still gate — as steps inside build-test-lint (the required
      # check), NOT a separate job that branch protection wouldn't enforce.
      #
      # WHY ONE STEP PER PACKAGE (not the old single bundled invocation): a
      # `-tags=integration` run re-executes each package's ENTIRE default suite
      # (the build tag only ADDS files) plus the tagged standby tests, so the
      # three packages together cost ~8m of work on a 2-core runner. Bundling
      # them under one `-timeout=5m` made them share a single budget, and
      # cmd/fleet alone (~3.5m local, longer on CI) overran it — the panic seen
      # in run 27597394005. Splitting gives EACH package its own fresh timeout,
      # so a slow package can't starve the others and the failure is attributable
      # to one package. Budgets (spawn 5m, cmd/fleet 7m, handoffop 5m) bound the
      # worst case to ~17m sequential, but Go runs the suites fast in practice
      # (~3-4m each on CI); the per-step caps are headroom, not the expected run.
      #
      # FLEET_STANDBY_TIMEOUT=3s caps each standby at 3s (vs the 10m production
      # default), so even an aborted run self-reaps in seconds. No -race here:
      # these tests exec real tmux-pane subprocesses (the race detector
      # instruments only in-process goroutines, and -race would roughly double
      # each lane's wall time for no added coverage of the subprocess paths this
      # lane exists to exercise).
      - name: Integration lane — internal/spawn
        run: FLEET_STANDBY_TIMEOUT=3s go test -tags=integration -count=1 -timeout=5m ./internal/spawn

      - name: Integration lane — cmd/fleet
        run: FLEET_STANDBY_TIMEOUT=3s go test -tags=integration -count=1 -timeout=7m ./cmd/fleet

      - name: Integration lane — internal/handoffop
        run: FLEET_STANDBY_TIMEOUT=3s go test -tags=integration -count=1 -timeout=5m ./internal/handoffop

      - name: Python tests
        run: python3 -m pytest skills/ scripts/ -q

      - name: Reap /tmp/fleet-test-* sockets
        # Linux hosted runners can retain tmux socket inodes after the
        # race-enabled test binaries exit cleanly. This cleanup keeps the
        # job's final state leak-free; the following assertion remains the
        # gate for any socket that cannot be reaped.
        if: always()
        run: |
          leaked=$(find /tmp -maxdepth 1 -name 'fleet-test-*.sock' \
            -newer /tmp/fleet-test-ci-sentinel 2>/dev/null || true)
          if [ -z "$leaked" ]; then
            echo "no /tmp/fleet-test-*.sock cleanup needed"
            exit 0
          fi
          echo "reaping /tmp/fleet-test-*.sock files from this CI run:"
          echo "$leaked"
          for sock in $leaked; do
            if command -v tmux >/dev/null 2>&1; then
              tmux -S "$sock" kill-server >/dev/null 2>&1 || true
            fi
            rm -f "$sock" || true
          done

      - name: Assert no /tmp/fleet-test-* leak
        # fleet#165 PR-B gate. The test-suite Sweep (internal/testutil)
        # reaps stale fleet-test-*.sock files at every package's TestMain
        # boundary; this step catches any leak that bypasses the sweeper
        # (e.g., a future test that creates a leak with a different
        # naming pattern, or a panic that wedges before the post-test
        # sweep). Scoped to files NEWER than the pre-test sentinel so a
        # local dev machine running `act` doesn't fail on pre-existing
        # /tmp/fleet-test-* from before this PR landed.
        #
        # `if: always()` (codex iter-1 [P2]): the leak gate must run on
        # the failure/panic path too — that's the exact case the comment
        # above promises to catch. Without `if: always()`, GitHub Actions
        # defaults to `if: success()` and silently skips this step when
        # `go test` fails, defeating the gate. We still want the overall
        # job to fail on leak detection (exit 1 below), so `always()`
        # only re-enables the step; it does not mask test failures.
        #
        # Step order (codex iter-5 [P2]): placed AFTER both `go test`
        # AND `python3 -m pytest skills/` so any pytest that touches
        # /tmp/fleet-test-* is also covered. Today's pytest suite only
        # exercises the Python skill scaffold (no Go tmux paths), but
        # defense-in-depth keeps the gate honest if a future skill test
        # ever shells out to tmux.
        if: always()
        run: |
          leaked=$(find /tmp -maxdepth 1 -name 'fleet-test-*' \
            -newer /tmp/fleet-test-ci-sentinel \
            ! -name 'fleet-test-ci-sentinel' 2>/dev/null || true)
          if [ -n "$leaked" ]; then
            echo "::error::leaked /tmp/fleet-test-* files from this CI run:"
            echo "$leaked"
            ls -la $leaked 2>/dev/null || true
            exit 1
          fi
          echo "no /tmp/fleet-test-* leak detected"
